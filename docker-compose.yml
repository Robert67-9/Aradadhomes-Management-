version: '3.8'

services:
  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: havenstay_backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    volumes:
      - havenstay_data:/app/data
    ports:
      - "8000:8000"
    networks:
      - havenstay_network

  # React Frontend + Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: havenstay_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - havenstay_network

networks:
  havenstay_network:
    driver: bridge

volumes:
  havenstay_data:
    driver: local
